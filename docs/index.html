<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>农小禾 · 健康 Agent</title>
<style>
/* 农小禾 Agent · 样式（三套主题：健身黑绿 / 健康浅绿 / 管理员未来科技） */
:root {
  --radius: 16px; --fs: 14px; --shadow: 0 10px 30px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: var(--fs); }
body { background: #eef1ee; color: #1b2620; }
button, input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }

/* ---------- 登录 ---------- */
.auth-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: #0b120e; color: #eafff2; }
.auth-panel { display: flex; flex-direction: column; justify-content: center; padding: 8vh 10%; background: linear-gradient(145deg, #0d1712, #0a100d 60%); }
.auth-brand .logo { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg, #c8ff5c, #48d98a); color: #08110b; font-weight: 900; font-size: 24px; }
.auth-brand .logo.big { width: 62px; height: 62px; font-size: 30px; }
.auth-brand h1 { font-size: 31px; margin: 24px 0 8px; letter-spacing: -.5px; }
.auth-brand p { color: #8fb39c; margin: 0; }
.auth-form { margin-top: 36px; max-width: 440px; }
.auth-form .fl span { color: #9ec4ac; }
.auth-form .fl input { background: #111d16; border: 1px solid #2b4033; color: #eafff2; }
.auth-form .fl input:focus { border-color: #6fe6a3; }
.auth-foot { margin-top: 20px; color: #6f8f7b; font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.auth-aside { position: relative; overflow: hidden; background: radial-gradient(circle at 65% 40%, rgba(117,255,173,.22), transparent 45%), linear-gradient(135deg, #102019, #050b08); display: grid; place-items: center; }
.orbit { position: absolute; border: 1px solid rgba(134,255,183,.16); border-radius: 50%; }
.o1 { width: 520px; height: 520px; animation: spin 24s linear infinite; border-style: dashed; }
.o2 { width: 360px; height: 360px; animation: spin 16s linear infinite reverse; }
.o3 { width: 190px; height: 190px; background: radial-gradient(circle, rgba(140,255,190,.14), transparent 70%); }
@keyframes spin { to { transform: rotate(360deg); } }
.aside-copy { position: relative; z-index: 2; text-align: center; }
.aside-copy .tag, .tag { display: inline-block; letter-spacing: 2px; font-size: 11px; color: #7fffb5; border: 1px solid rgba(127,255,181,.35); padding: 5px 10px; border-radius: 99px; }
.aside-copy h2 { font-size: 44px; line-height: 1.2; margin: 22px 0 14px; }
.aside-copy p { color: #8fb39c; }
.auth-form .admin-entry { margin-top: 12px; border-color: #7fffb5; color: #7fffb5; background: rgba(127,255,181,.08); box-shadow: 0 0 18px rgba(127,255,181,.2); }

/* ---------- 模式选择 ---------- */
.mode-wrap { min-height: 100vh; background: radial-gradient(circle at 20% 0%, #e8f9ee, #f7faf8 55%); padding: 7vh 6%; }
.mode-head { text-align: center; margin-bottom: 44px; }
.mode-head h1 { font-size: 34px; margin: 18px 0 8px; }
.mode-head p { color: #6f7d74; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1000px; margin: 0 auto; }
.mode-card { position: relative; overflow: hidden; padding: 34px; border-radius: 22px; min-height: 340px; transition: transform .2s, box-shadow .2s; }
.mode-card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px rgba(0,0,0,.16); }
.mode-card.fitness { background: linear-gradient(150deg, #08100c, #101d15); color: #eafff2; border: 1px solid #21422e; }
.mode-card.fitness::after { content: ''; position: absolute; width: 280px; height: 280px; right: -80px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(91,255,156,.28), transparent 70%); }
.mode-card.health { background: linear-gradient(150deg, #f2fbf5, #e4f4ea); color: #1d3a29; border: 1px solid #cce8d7; }
.mode-card.health::after { content: ''; position: absolute; width: 280px; height: 280px; right: -80px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(85,185,130,.18), transparent 70%); }
.mode-kicker { font-size: 11px; letter-spacing: 3px; color: #7fffb5; }
.mode-card.health .mode-kicker { color: #4e9c71; }
.mode-card h2 { font-size: 32px; margin: 14px 0 10px; }
.mode-card p { line-height: 1.7; opacity: .82; }
.mode-card ul { padding-left: 18px; line-height: 2; opacity: .85; }
.mode-cta { display: inline-block; margin-top: 16px; font-weight: 700; }

/* ---------- 应用骨架 ---------- */
.app-shell { min-height: 100vh; padding-bottom: 78px; }
.topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 5%; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; font-weight: 900; }
.brand div { display: flex; flex-direction: column; line-height: 1.2; }
.brand strong { font-size: 15px; letter-spacing: .3px; }
.brand small { font-size: 10px; opacity: .6; }
.top-right { display: flex; align-items: center; gap: 12px; }
.mode-pill { font-size: 11px; padding: 5px 10px; border-radius: 99px; border: 1px solid currentColor; opacity: .8; }
.ghost-btn, .icon-btn { background: transparent; border: 1px solid currentColor; border-radius: 9px; padding: 6px 11px; cursor: pointer; opacity: .8; }
.icon-btn { font-size: 17px; line-height: 1; }
.main { max-width: 1120px; margin: 0 auto; padding: 26px 18px 36px; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; height: 66px; display: flex; justify-content: center; gap: 8px; padding: 8px 5%; z-index: 30; backdrop-filter: blur(16px); }
.tab { flex: 1; max-width: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; font-size: 11px; opacity: .62; transition: .2s; }
.tab .ti { font-size: 19px; line-height: 1; }
.tab.on { opacity: 1; }
.tab:hover { opacity: .95; }

/* ---------- 健身主题 ---------- */
.theme-fitness { background: radial-gradient(circle at 10% 0%, #10241a, #060b08 42%); color: #e9fff2; }
.theme-fitness .topbar, .theme-fitness .tabbar { background: rgba(7,14,10,.84); border-color: #1c3526; }
.theme-fitness .tabbar { border-top: 1px solid #1c3526; }
.theme-fitness .brand .logo { background: linear-gradient(145deg, #c8ff5c, #39ff9a); color: #07110b; }
.theme-fitness .brand small { color: #7bd6a0; }
.theme-fitness .mode-pill, .theme-fitness .ghost-btn { color: #8bf0b6; border-color: #2d5c3e; }
.theme-fitness .page-head h1 { color: #eafff2; }
.theme-fitness .page-head p { color: #86b497; }
.theme-fitness .card { background: linear-gradient(160deg, rgba(22,42,29,.85), rgba(10,19,14,.92)); border: 1px solid #244b33; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.theme-fitness .card-h h3 { color: #b9ffd3; }
.theme-fitness .note { color: #7fb493; }
.theme-fitness .btn.primary { background: linear-gradient(120deg, #39ff9a, #b6ff5c); color: #06110a; border: none; }
.theme-fitness .btn.ghost { border-color: #3b6e4d; color: #9be6bb; }
.theme-fitness .btn.danger { color: #ff9c9c; border-color: #6d3b3b; }
.theme-fitness .score-badge { background: rgba(57,255,154,.08); border-color: #2d5c3e; }
.theme-fitness .score-badge strong { color: #b6ff5c; }
.theme-fitness .quick-row, .theme-fitness .compare-grid, .theme-fitness .progress-block, .theme-fitness .score-parts { background: rgba(12,27,18,.7); border-color: #244b33; }
.theme-fitness .cmp em.down { color: #7dffb0; } .theme-fitness .cmp em.up { color: #ff9a76; }
.theme-fitness .post, .theme-fitness .product, .theme-fitness .qa, .theme-fitness .plan, .theme-fitness .verdict, .theme-fitness .detail-grid { background: rgba(13,28,19,.8); border-color: #21462f; }
.theme-fitness .act { border-color: #2d5c3e; color: #9be6bb; }
.theme-fitness .act.on, .theme-fitness .btn.primary.sm { background: rgba(57,255,154,.18); color: #c9ffdd; }
.theme-fitness .ai-banner { background: linear-gradient(120deg, rgba(57,255,154,.14), rgba(182,255,92,.05)); border-color: #2d5c3e; }
.theme-fitness .bar { background: #1a3021; } .theme-fitness .bar i { background: linear-gradient(90deg, #39ff9a, #b6ff5c); }
.theme-fitness .bar.alt i { background: linear-gradient(90deg, #4bc3ff, #7be0ff); }

/* ---------- 健康主题 ---------- */
.theme-health { background: linear-gradient(180deg, #f6fbf7, #eef6f0); color: #234131; }
.theme-health .topbar, .theme-health .tabbar { background: rgba(248,252,249,.9); border-color: #dcece2; }
.theme-health .tabbar { border-top: 1px solid #dcece2; }
.theme-health .brand .logo { background: linear-gradient(145deg, #8ddbb0, #4aa978); color: #fff; }
.theme-health .brand small { color: #7a9b86; }
.theme-health .mode-pill, .theme-health .ghost-btn { color: #4e9c71; border-color: #c9e3d3; }
.theme-health .page-head h1 { color: #1d4a32; }
.theme-health .page-head p { color: #739283; }
.theme-health .card { background: #fff; border: 1px solid #e3efe7; box-shadow: 0 8px 24px rgba(46,105,71,.06); }
.theme-health .card-h h3 { color: #2e6c49; }
.theme-health .note { color: #7d9989; }
.theme-health .btn.primary { background: linear-gradient(120deg, #57b986, #87d6a8); color: #fff; border: none; }
.theme-health .btn.ghost { border-color: #c9e3d3; color: #4e9c71; }
.theme-health .btn.danger { color: #b35e5e; border-color: #e6cccc; }
.theme-health .score-badge { background: #eff8f2; border-color: #d7ebdf; }
.theme-health .score-badge strong { color: #47a875; }
.theme-health .quick-row, .theme-health .compare-grid, .theme-health .progress-block, .theme-health .score-parts { background: #fff; border-color: #e3efe7; }
.theme-health .cmp em.down { color: #3ca672; } .theme-health .cmp em.up { color: #d18457; }
.theme-health .post, .theme-health .product, .theme-health .qa, .theme-health .plan, .theme-health .verdict, .theme-health .detail-grid { background: #fff; border-color: #e5f0e8; }
.theme-health .act { border-color: #d7ebdf; color: #54886a; }
.theme-health .act.on, .theme-health .btn.primary.sm { background: #e8f6ed; color: #2e7a50; }
.theme-health .ai-banner { background: linear-gradient(120deg, #e7f7ed, #f7fcf9); border-color: #d3ebdc; }
.theme-health .bar { background: #e9f3ed; } .theme-health .bar i { background: linear-gradient(90deg, #4faf7c, #9fe0bb); }
.theme-health .bar.alt i { background: linear-gradient(90deg, #6db6d8, #a8dcee); }
.theme-health .verdict.优秀, .theme-health .verdict.良好 { border-left-color: #48a978; }
.theme-health .verdict.一般 { border-left-color: #d3b057; }
.theme-health .verdict.偏弱, .theme-health .verdict.较弱 { border-left-color: #d17a68; }

/* ---------- 通用组件 ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head h1 { font-size: 27px; margin: 8px 0 5px; }
.page-head p { margin: 0; opacity: .7; }
.page-head .kicker, .kicker { font-size: 10px; letter-spacing: 2.5px; opacity: .7; }
.score-badge { border: 1px solid; border-radius: 14px; padding: 8px 18px; text-align: center; white-space: nowrap; }
.score-badge small { display: block; font-size: 10px; opacity: .65; }
.score-badge strong { font-size: 28px; }
.score-badge span { font-size: 11px; opacity: .6; margin-left: 3px; }
.quick-row, .compare-grid, .admin-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.quick-row > div, .admin-stats > div { border: 1px solid; border-radius: 12px; padding: 12px 14px; }
.quick-row span, .admin-stats span { display: block; font-size: 11px; opacity: .65; }
.quick-row strong, .admin-stats strong { font-size: 20px; }
.card { border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
.card-h { padding: 14px 18px; border-bottom: 1px solid rgba(128,128,128,.14); }
.card-h h3 { margin: 0; font-size: 15px; }
.card-b { padding: 18px; }
.card-f { padding: 10px 18px; border-top: 1px solid rgba(128,128,128,.12); }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.fl { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.fl span, .fl-title { opacity: .72; }
.fl input, .fl select, .fl textarea, .comment-form input, .admin-search input, .qa-form input {
  border: 1px solid rgba(128,128,128,.3); border-radius: 9px; padding: 9px 11px; background: rgba(127,127,127,.06); color: inherit; outline: none; width: 100%;
}
.fl input:focus, .fl select:focus, .fl textarea:focus, .qa-form input:focus { border-color: #59c98c; }
.fl textarea { resize: vertical; }
.note { font-size: 12px; line-height: 1.7; opacity: .8; margin: 4px 0; }
.btn { border: 1px solid rgba(128,128,128,.3); border-radius: 9px; padding: 9px 16px; cursor: pointer; background: transparent; color: inherit; font-weight: 600; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.wide { width: 100%; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn.primary { font-weight: 700; }
.chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.chart { border: 1px solid rgba(128,128,128,.16); border-radius: 12px; padding: 12px; }
.chart-top { display: flex; justify-content: space-between; font-size: 12px; opacity: .8; }
.chart svg { width: 100%; height: 90px; margin-top: 6px; }
.chart-axis, .chart-empty { display: flex; justify-content: space-between; font-size: 11px; opacity: .55; }
.chart-empty { display: block; text-align: center; padding: 30px 0; }
.compare-grid { grid-template-columns: repeat(4, 1fr); margin-top: 16px; }
.cmp { border: 1px solid; border-radius: 12px; padding: 12px; }
.cmp span { display: block; font-size: 11px; opacity: .65; }
.cmp b { font-size: 18px; }
.cmp em { display: block; font-style: normal; font-size: 12px; }
.progress-block { border: 1px solid; border-radius: 12px; padding: 14px; margin-top: 16px; font-size: 12px; }
.bar { height: 8px; border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.score-parts { display: flex; gap: 10px; flex-wrap: wrap; border: 1px solid; border-radius: 12px; padding: 12px; margin-top: 14px; font-size: 12px; }
.photo-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 12px; align-items: end; }
.photo-block h4 { margin: 18px 0 8px; font-size: 13px; }
.photo-timeline { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.photo-timeline figure { margin: 0; flex: 0 0 130px; }
.photo-timeline img { width: 130px; height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(128,128,128,.25); }
.photo-timeline figcaption { font-size: 11px; opacity: .65; text-align: center; margin-top: 5px; }
.empty { opacity: .6; font-size: 13px; }
.remind-row, .setting-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
details summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.standards { line-height: 1.9; font-size: 12px; opacity: .85; padding-left: 18px; }
.check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 14px; }
.check-grid label { display: flex; gap: 6px; align-items: center; font-size: 12px; }

/* 广场 */
.post-list { display: grid; gap: 14px; }
.post, .product, .qa, .plan, .verdict, .detail-grid { border: 1px solid; border-radius: 14px; padding: 16px; }
.post-head, .uc-head, .cc-head { display: flex; align-items: center; gap: 10px; }
.post-head strong, .uc-head strong { display: block; }
.post-head small, .uc-head small { opacity: .6; font-size: 11px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #68c995, #b4e8c8); color: #123; font-weight: 800; }
.post h3 { margin: 12px 0 6px; font-size: 16px; }
.post p { line-height: 1.7; opacity: .85; }
.post-plan { border-left: 3px solid #5fc88f; padding: 8px 12px; font-size: 12px; opacity: .8; background: rgba(127,127,127,.05); }
.post-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.act { border: 1px solid; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; background: transparent; color: inherit; }
.act:disabled { opacity: .45; cursor: not-allowed; }
.comments p { font-size: 12px; margin: 6px 0; }
.comments small { opacity: .5; }
.comment-form { display: flex; gap: 8px; }
.comment-form input { flex: 1; }
.comment-form button, .admin-search button, .qa-form button { border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; background: #58bb87; color: #fff; font-weight: 600; }

/* 慧选 */
.ai-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; border: 1px solid; border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
.ai-banner p { margin: 6px 0 0; font-size: 12px; opacity: .8; }
.shop-group { margin-bottom: 22px; }
.shop-group h2 { font-size: 16px; margin: 0 0 12px; }
.product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.product-top { display: flex; justify-content: space-between; font-size: 12px; }
.product-top .cat { opacity: .6; }
.product h3 { margin: 10px 0 6px; font-size: 16px; }
.product > p { font-size: 12px; opacity: .7; line-height: 1.6; min-height: 36px; }
.nutri, .organic { display: flex; flex-wrap: wrap; gap: 5px; }
.nutri span, .organic i { font-size: 11px; padding: 3px 7px; border-radius: 6px; background: rgba(127,127,127,.09); font-style: normal; }
.organic i { background: rgba(89,201,140,.15); }
.product-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; font-size: 11px; opacity: .9; }

/* 个人中心 */
.qa-log { max-height: 260px; overflow-y: auto; display: grid; gap: 8px; margin-bottom: 12px; }
.qa { display: flex; gap: 10px; }
.qa span { font-size: 11px; font-weight: 800; opacity: .7; flex: 0 0 24px; }
.qa p { margin: 0; line-height: 1.7; font-size: 13px; }
.qa-form { display: flex; gap: 8px; }
.qa-form input { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chips button { border: 1px solid rgba(128,128,128,.25); background: transparent; color: inherit; border-radius: 99px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
.plan h4 { margin: 0 0 10px; font-size: 16px; }
.plan h5 { margin: 12px 0 5px; font-size: 13px; }
.plan ul { margin: 0; padding-left: 18px; line-height: 1.9; font-size: 13px; }
.rec-list, .points-panel, .growth { margin-top: 14px; }
.rec-list h4 { font-size: 13px; }
.rec-list div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed rgba(128,128,128,.18); font-size: 12px; }
.points-panel, .growth { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.points-panel span, .growth span { font-size: 12px; opacity: .7; }
.points-panel strong, .growth strong { font-size: 28px; }
.growth .chart { flex: 1 1 220px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(128,128,128,.15); }
.cart-item small { display: block; opacity: .6; }
.qty { display: flex; align-items: center; gap: 10px; }
.qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(128,128,128,.3); background: transparent; color: inherit; cursor: pointer; }
.cart-total { margin-top: 14px; text-align: right; }
.verdict { margin-bottom: 10px; border-left: 4px solid #59c98c; }
.verdict span { font-size: 12px; font-weight: 700; }
.verdict p { margin: 5px 0 0; font-size: 12px; line-height: 1.7; }

/* ---------- 管理员主题（未来科技） ---------- */
.theme-admin { background: #040a12; color: #d8f7ff; font-family: "SFMono-Regular", Consolas, "PingFang SC", monospace; position: relative; }
.grid-bg { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(0,229,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.055) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 20%, #000, transparent 80%); }
.theme-admin .topbar, .theme-admin .tabbar { background: rgba(4,10,18,.9); border-color: #12475a; }
.theme-admin .tabbar { border-top: 1px solid #12475a; }
.theme-admin .topbar { box-shadow: 0 0 30px rgba(0,229,255,.08); }
.theme-admin .brand .logo { background: linear-gradient(145deg, #00e5ff, #7b5cff); color: #02121a; box-shadow: 0 0 18px rgba(0,229,255,.4); }
.theme-admin .brand small { color: #4aa6bd; }
.theme-admin .mode-pill { display: none; }
.theme-admin .ghost-btn { color: #55d6f0; border-color: #1c657a; }
.theme-admin .live { font-size: 10px; letter-spacing: 2px; color: #5fffd0; }
.theme-admin .live i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #5fffd0; box-shadow: 0 0 10px #5fffd0; margin-right: 6px; }
.admin-main { position: relative; z-index: 2; }
.admin-head h1 { color: #e8fdff; text-shadow: 0 0 18px rgba(0,229,255,.35); }
.admin-head p, .admin-head .kicker { color: #6ba9ba; }
.admin-btn { background: linear-gradient(120deg, #00d8ff, #6a5cff); color: #02121a; border: none; box-shadow: 0 0 18px rgba(0,216,255,.25); }
.admin-btn.ghost { background: transparent; border: 1px solid #1c657a; color: #55d6f0; box-shadow: none; }
.admin-search { display: flex; gap: 8px; margin-bottom: 18px; }
.admin-search input { background: #071722; border-color: #15485c; color: #d8f7ff; }
.admin-search button { background: linear-gradient(120deg, #00b8d9, #5a5cff); white-space: nowrap; flex: 0 0 auto; padding: 0 20px; }
.admin-stats { grid-template-columns: repeat(3, 1fr); }
.admin-stats > div { background: rgba(5,22,32,.85); border-color: #15485c; box-shadow: inset 0 0 20px rgba(0,229,255,.05); }
.admin-stats strong { color: #5fffd0; text-shadow: 0 0 12px rgba(95,255,208,.4); }
.admin-table { border: 1px solid #15485c; border-radius: 12px; overflow: hidden; background: rgba(4,16,24,.8); }

.admin-table .tr.head { background: rgba(0,229,255,.08); color: #68c8e0; letter-spacing: 1px; }
.admin-table .tr:last-child { border-bottom: none; }
.admin-table small { display: block; opacity: .55; margin-top: 3px; }
.admin-table .mini { font-size: 11px; opacity: .8; }
.ops { display: flex; gap: 6px; }
.ops button, .uc-foot button { border: 1px solid #1c657a; background: rgba(0,229,255,.06); color: #7be6ff; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 11px; }
.ops button:last-child { border-color: #7a3548; color: #ff9db3; }
.user-grid, .cart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.user-card, .cart-card { background: rgba(5,19,28,.85); border: 1px solid #15485c; border-radius: 14px; padding: 16px; box-shadow: inset 0 0 30px rgba(0,229,255,.04); }
.user-card .avatar { background: linear-gradient(135deg, #00d8ff, #6a5cff); color: #04121a; }
.uc-meta, .uc-kv { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.uc-meta span, .uc-kv span { border: 1px solid #15485c; border-radius: 6px; padding: 3px 8px; font-size: 11px; color: #9fd8e8; }
.uc-plan { border-left: 2px solid #6a5cff; padding-left: 10px; font-size: 12px; }
.uc-plan b { color: #9fb8ff; }
.uc-foot { margin-top: 12px; display: flex; gap: 8px; }
.cc-head { justify-content: space-between; }
.cc-head span { color: #5f9eb0; font-size: 12px; }
.cc-stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.cc-stat > div { border: 1px solid #15485c; border-radius: 8px; padding: 8px; text-align: center; }

.detail-table > div { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 7px 0; border-bottom: 1px dashed rgba(128,128,128,.2); font-size: 11px; }

.modal-mask { position: fixed; inset: 0; background: rgba(3,8,12,.68); display: grid; place-items: center; z-index: 100; padding: 18px; backdrop-filter: blur(4px); }

.modal-card h4 { margin: 18px 0 8px; font-size: 13px; color: #9be6bb; }

.demo-hint { display: block; margin-top: 12px; color: #7fb493; font-size: 11px; }
.admin-modal { background: #061521; border-color: #1c657a; box-shadow: 0 0 40px rgba(0,229,255,.15); }
.admin-modal h2 { color: #d8f7ff; }

.modal-card .fl input, .modal-card .fl textarea, .modal-card .fl select { background: rgba(127,127,127,.08); border: 1px solid rgba(128,128,128,.3); color: inherit; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: #123c26; color: #eafff2; border: 1px solid #3f9d68; padding: 10px 18px; border-radius: 99px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: #4a1f27; border-color: #a45062; }

}

  function ask(question, user, products) {
    var q = (question || '').toLowerCase();
    var hit = null;
    for (var i = 0; i < KB.length; i++) {
      var keys = KB[i].k;
      for (var j = 0; j < keys.length; j++) {
        if (q.indexOf(keys[j].toLowerCase()) >= 0) { hit = KB[i]; break; }
      }
      if (hit) break;
    }
    if (!hit) {
      var rec = recommend(user, products || []);
      var names = rec.map(function (r) { return r.product.name; }).join('、');
      return '我可以回答各项健康指标的含义，以及产品营养成分与身体状况的关联。你可以试着问“体脂率怎么看”“小腿围低于多少要警惕”“鱼油和什么有关”。' +
        (names ? ' 根据你的档案，当前较匹配的产品是：' + names + '。' : '') + ' 所有回答仅供记录参考，不构成医疗诊断。';
    }
    return hit.t + ' 以上为一般性健康知识，不替代医生诊断；如有不适请及时就医。';
  }

  window.ENGINE = {
    LEVELS: LEVELS, clamp: clamp, num: num, verdict: verdict,
    scoreBalance: scoreBalance, scoreCalf: scoreCalf, scoreBreath: scoreBreath,
    scoreReach: scoreReach, scoreSitStand: scoreSitStand, scoreCognition: scoreCognition,
    scoreAll: scoreAll, progressScore: progressScore, bmi: bmi, bmr: bmr,
    recommend: recommend, makePlan: makePlan, ask: ask
  };
})();

    return '<div class="chart"><div class="chart-top"><span>' + esc(label) + '</span><strong>' + vals[vals.length - 1] + esc(unit) + '</strong></div>' +

      '<div class="admin-stats"><div><span>产品总数</span><strong>' + products.length + '</strong></div><div><span>品类数</span><strong>' + Object.keys(products.reduce(function (a, p) { a[p.category] = 1; return a; }, {})).length + '</strong></div><div><span>当前显示</span><strong>' + list.length + '</strong></div></div>' +
      '<div class="admin-table"><div class="tr head"><span>产品</span><span>品类</span><span>价格 / 积分</span><span>营养与有机标注</span><span>操作</span></div>' +
      list.map(function (p) {
        var nutri = Object.keys(p.nutrition || {}).map(function (k) { return k + ' ' + p.nutrition[k]; }).join(' · ');
        return '<div class="tr"><span><b>' + esc(p.name) + '</b><small>' + esc(p.desc) + '</small></span><span>' + esc(p.category) + '</span>' +
          '<span>¥' + p.price + '<small>' + p.points + ' 积分</small></span><span class="mini">' + esc(nutri) + '<small>' + esc((p.organic || []).join(' · ')) + '</small></span>' +
          '<span class="ops"><button data-act="product-edit" data-id="' + p.id + '">编辑</button><button data-act="product-del" data-id="' + p.id + '">删除</button></span></div>';
      }).join('') + '</div>';
    return adminShell('PRODUCTS', 'admin/products', html);
  };
  V.adminUsers = function (state, filter) {
    var users = state.users || [];
    var q = (filter || '').toLowerCase();
    var list = q ? users.filter(function (u) { return (u.name + u.phone).toLowerCase().indexOf(q) >= 0; }) : users;
    var html = '<div class="page-head admin-head"><div><span class="kicker">USER ARCHIVE</span><h1>用户健康档案汇总</h1><p>全量用户档案、身体记录与 AI 生成方案，支持搜索查询。</p></div></div>' +
      '<form data-form="user-search" class="admin-search"><input name="q" placeholder="搜索姓名 / 手机号" value="' + esc(filter || '') + '"><button type="submit">搜索用户</button></form>' +
      '<div class="user-grid">' + list.map(function (u) {
        var p = u.profile || {}, plan = u.plan;
        return '<article class="user-card"><div class="uc-head"><div class="avatar">' + esc(u.name.slice(0, 1)) + '</div><div><strong>' + esc(u.name) + '</strong><small>' + esc(u.phone) + ' · ' + esc(u.mode === 'health' ? '健康模式' : u.mode === 'fitness' ? '健身模式' : '未选择') + '</small></div></div>' +
          '<div class="uc-meta"><span>性别 ' + esc(p.gender === 'male' ? '男' : '女') + '</span><span>年龄 ' + esc(p.age) + '</span><span>目标 ' + esc(p.goal) + '</span><span>积分 ' + (u.points || 0) + '</span></div>' +
          '<div class="uc-kv"><span>身高 ' + esc(p.height) + 'cm</span><span>体重 ' + esc(DATA.latest(u, 'weight') || p.weight) + 'kg</span><span>体脂 ' + esc(DATA.latest(u, 'bodyFat') || '—') + '%</span><span>病史 ' + esc(p.medical || '无') + '</span></div>' +
          '<div class="uc-plan"><b>AI 方案</b><p>' + (plan ? esc(plan.title) + ' · 训练 ' + plan.train.length + ' 条 / 饮食 ' + plan.diet.length + ' 条' : '尚未生成') + '</p></div>' +
          '<div class="uc-foot"><button class="admin-btn sm" data-act="user-detail" data-id="' + u.id + '">查看完整档案</button><button class="admin-btn ghost sm" data-act="user-plan" data-id="' + u.id + '">查看 AI 方案</button></div></article>';
      }).join('') + '</div>';
    return adminShell('USERS', 'admin/users', html);
  };
  V.adminCarts = function (state, filter) {
    var users = state.users || [], q = (filter || '').toLowerCase();
    var list = q ? users.filter(function (u) { return (u.name + u.phone).toLowerCase().indexOf(q) >= 0; }) : users;
    var html = '<div class="page-head admin-head"><div><span class="kicker">CART INTELLIGENCE</span><h1>购物车选品汇总</h1><p>按用户查看购物车中的商品种类、数量与积分合计。</p></div></div>' +
      '<form data-form="cart-search" class="admin-search"><input name="q" placeholder="搜索用户姓名 / 手机号" value="' + esc(filter || '') + '"><button type="submit">搜索用户</button></form>' +
      '<div class="cart-grid">' + list.map(function (u) {
        var cart = u.cart || [], count = cart.reduce(function (a, x) { return a + x.qty; }, 0);
        var points = cart.reduce(function (a, x) {
          var p = state.products.filter(function (y) { return y.id === x.productId; })[0];
          return a + (p ? p.points * x.qty : 0);
        }, 0);
        return '<article class="cart-card"><div class="cc-head"><strong>' + esc(u.name) + '</strong><span>' + esc(u.phone) + '</span></div>' +
          '<div class="cc-stat"><div><span>商品种类</span><b>' + cart.length + '</b></div><div><span>商品数量</span><b>' + count + '</b></div><div><span>积分合计</span><b>' + points + '</b></div></div>' +
          '<ul>' + cart.map(function (x) {
            var p = state.products.filter(function (y) { return y.id === x.productId; })[0];
            return '<li><span>' + esc(p ? p.name : '已下架商品') + '</span><b>× ' + x.qty + '</b></li>';
          }).join('') + '</ul>' +
          (cart.length ? '' : '<p class="empty">购物车为空</p>') + '</article>';
      }).join('') + '</div>';
    return adminShell('CARTS', 'admin/carts', html);
  };

  V.modals = {
    userCode: function (phone) {
      return '<div class="modal-card"><span class="kicker">LOGIN VERIFICATION</span><h2>用户登录验证</h2>' +
        '<p>已核验账号 ' + esc(phone) + ' 的密码。请输入短信验证码继续。</p>' +
        '<form data-form="user-code"><label class="fl"><span>验证码</span><input name="code" type="tel" maxlength="6" placeholder="演示验证码 888888" required></label>' +
        '<div class="modal-actions"><button type="button" class="btn ghost" data-act="close-modal">取消</button><button type="submit" class="btn primary">验证并登录</button></div></form>' +
        '<small class="demo-hint">演示验证码：888888（本地模拟，不发送真实短信）</small></div>';
    },
    adminCode: function () {
      return '<div class="modal-card admin-modal"><span class="kicker">RESTRICTED ACCESS</span><h2>管理员身份验证</h2>' +
        '<p>已识别内部号码 ' + DATA.ADMIN_PHONE + '。请输入短信验证码继续。</p>' +
        '<form data-form="admin-code"><label class="fl"><span>验证码</span><input name="code" type="tel" maxlength="6" placeholder="演示验证码 888888" required></label>' +
        '<div class="modal-actions"><button type="button" class="btn ghost" data-act="close-modal">取消</button><button type="submit" class="btn admin-btn">验证并进入</button></div></form>' +
        '<small class="demo-hint">演示验证码：888888（本地模拟，不发送真实短信）</small></div>';
    },
    productForm: function (p) {
      p = p || {};
      return '<div class="modal-card"><h2>' + (p.id ? '编辑产品' : '新增产品') + '</h2><form data-form="product-save" data-id="' + esc(p.id || '') + '" class="form-grid">' +
        fld('name', '产品名称', { type: 'text', value: p.name }) + fld('category', '品类', { type: 'text', value: p.category }) +
        fld('price', '价格 ¥', { value: p.price, step: '0.1' }) + fld('points', '兑换积分', { value: p.points }) +
        '<div class="full">' + fld('desc', '产品描述', { type: 'textarea', value: p.desc }) + '</div>' +
        '<div class="full">' + fld('nutritionText', '营养成分（每行 名称:含量）', { type: 'textarea', value: Object.keys(p.nutrition || {}).map(function (k) { return k + ':' + p.nutrition[k]; }).join('\n') }) + '</div>' +
        '<div class="full">' + fld('organicText', '有机物质 / 认证（逗号分隔）', { type: 'text', value: (p.organic || []).join('，') }) + '</div>' +
        '<div class="full">' + fld('tagsText', '标签（逗号分隔，如 减脂,控糖）', { type: 'text', value: (p.tags || []).join('，') }) + '</div>' +
        '<div class="full modal-actions"><button type="button" class="btn ghost" data-act="close-modal">取消</button><button type="submit" class="btn admin-btn">保存产品</button></div></form></div>';
    },
    userDetail: function (u, state) {
      var p = u.profile || {}, rs = (u.records || []).slice(0, 5);
      return '<div class="modal-card wide"><h2>' + esc(u.name) + ' · 完整健康档案</h2>' +
        '<p>手机号 ' + esc(u.phone) + ' · ' + esc(u.mode || '未选择模式') + ' · 注册 ' + esc(u.createdAt) + '</p>' +
        '<h4>基础档案</h4><div class="detail-grid"><span>性别 ' + esc(p.gender) + '</span><span>年龄 ' + esc(p.age) + '</span><span>身高 ' + esc(p.height) + 'cm</span><span>目标 ' + esc(p.goal) + '</span><span>目标体重 ' + esc(p.targetWeight) + 'kg</span><span>目标体脂 ' + esc(p.targetBodyFat) + '%</span><span>病史 ' + esc(p.medical || '无') + '</span></div>' +
        '<h4>最近记录</h4><div class="detail-table">' + (rs.length ? rs.map(function (r) {
          return '<div><span>' + esc(r.date) + '</span><span>体重 ' + esc(r.weight) + '</span><span>体脂 ' + esc(r.bodyFat) + '</span><span>肌肉 ' + esc(r.muscle) + '</span><span>腰围 ' + esc(r.waist) + '</span></div>';
        }).join('') : '<p class="empty">暂无记录</p>') + '</div>' +
        '<h4>健康模式记录</h4><p>日常记录 ' + (u.healthDaily || []).length + ' 条 · 专业自测 ' + (u.healthTests || []).length + ' 条 · 症状 ' + (u.symptoms || []).join('、') + '</p>' +
        '<div class="modal-actions"><button class="btn admin-btn" data-act="close-modal">关闭</button></div></div>';
    },
    userPlan: function (u, state) {
      var plan = u.plan || ENGINE.makePlan(u, state.products);
      return '<div class="modal-card wide"><h2>' + esc(u.name) + ' · AI 方案</h2><div class="plan">' +
        '<h4>' + esc(plan.title) + '</h4><h5>训练安排</h5><ul>' + plan.train.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<h5>饮食建议</h5><ul>' + plan.diet.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<h5>推荐产品</h5><ul>' + (plan.products || []).map(function (x) { return '<li>' + esc(x.name) + '（' + esc(x.reason) + '）</li>'; }).join('') + '</ul>' +
        '<p class="note">' + esc(plan.note) + '</p></div><div class="modal-actions"><button class="btn admin-btn" data-act="close-modal">关闭</button></div></div>';
    }
  };

  V.esc = esc;
  window.VIEWS = V;
})();

</script>
<script>
/* 农小禾 Agent · 路由与交互 */
(function () {
  'use strict';
  var state = DATA.load();
  var filters = { products: '', users: '', carts: '' };
  var app = document.getElementById('app');
  var modalRoot = document.getElementById('modal-root');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  var pendingLogin = null;

  function save() { DATA.save(state); }
  function esc(s) { return VIEWS.esc(s); }
  function toast(msg, bad) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2600);
  }
  function openModal(html) { modalRoot.innerHTML = '<div class="modal-mask" data-act="close-modal">' + html + '</div>'; }
  function closeModal() { modalRoot.innerHTML = ''; }
  function go(hash) { location.hash = hash; }

  function currentPath() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    return h || 'login';
  }

  function render() {
    var path = currentPath();
    var session = state.session;
    var parts = path.split('/');
    var root = parts[0];
    if (path === 'login') { app.innerHTML = VIEWS.login(); return; }
    if (!session) { go('#/login'); return; }
    if (session.type === 'admin') {
      if (root !== 'admin') { go('#/admin/products'); return; }
      if (path === 'admin/products') app.innerHTML = VIEWS.adminProducts(state, filters.products);
      else if (path === 'admin/users') app.innerHTML = VIEWS.adminUsers(state, filters.users);
      else if (path === 'admin/carts') app.innerHTML = VIEWS.adminCarts(state, filters.carts);
      else app.innerHTML = VIEWS.adminProducts(state, filters.products);
      window.scrollTo(0, 0);
      return;
    }
    var u = DATA.getUser(session.userId);
    if (!u) { state.session = null; save(); go('#/login'); return; }
    if (path === 'mode') { app.innerHTML = VIEWS.mode(u); window.scrollTo(0, 0); return; }
    if (!u.mode) {
      if (root === 'fitness' || root === 'health') { u.mode = root; save(); }
      else { go('#/mode'); return; }
    }
    var expected = u.mode;
    if (root !== expected) { go('#/' + expected + '/profile'); return; }
    if (path === 'fitness/profile') app.innerHTML = VIEWS.fitnessProfile(u, state);
    else if (path === 'fitness/plaza') app.innerHTML = VIEWS.fitnessPlaza(u, state);
    else if (path === 'fitness/shop') app.innerHTML = VIEWS.fitnessShop(u, state);
    else if (path === 'fitness/me') app.innerHTML = VIEWS.fitnessMe(u, state);
    else if (path === 'health/daily') app.innerHTML = VIEWS.healthDaily(u, state);
    else if (path === 'health/plaza') app.innerHTML = VIEWS.healthPlaza(u, state);
    else if (path === 'health/shop') app.innerHTML = VIEWS.healthShop(u, state);
    else if (path === 'health/me') app.innerHTML = VIEWS.healthMe(u, state);
    else app.innerHTML = VIEWS.fitnessProfile(u, state);
    window.scrollTo(0, 0);
  }

  /* ---------- 事件委托 ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (act === 'admin-entry') {
      var phone = (document.getElementById('loginPhone') || {}).value || '';
      if (phone.trim() === DATA.ADMIN_PHONE) openModal(VIEWS.modals.adminCode());
      else toast('仅内部号码可使用管理员入口', true);
      return;
    }
    if (act === 'close-modal') {
      if (el.classList.contains('modal-mask') && e.target !== el) return;
      if (modalRoot.querySelector('[data-form="user-code"]')) pendingLogin = null;
      closeModal(); return;
    }
    var u = DATA.currentUser();
    var isAdmin = state.session && state.session.type === 'admin';
    if (!u && !isAdmin && act !== 'reset-demo' && act !== 'switch-mode') return;
    if (isAdmin && !u && ['product-new', 'product-edit', 'product-del', 'user-detail', 'user-plan'].indexOf(act) < 0) return;
    switch (act) {
      case 'switch-mode':
        if (!u) { toast('请先登录', true); return; }
        u.mode = u.mode === 'fitness' ? 'health' : 'fitness';
        save(); go('#/' + u.mode + '/' + (u.mode === 'fitness' ? 'profile' : 'daily')); toast('已切换' + (u.mode === 'fitness' ? '健身' : '健康') + '模式');
        break;
      case 'upload-photo': {
        var form = el.closest('form');
        var file = form && form.elements.photo && form.elements.photo.files[0];
        if (!file) { toast('请先选择照片', true); return; }
        if (!/^image\//.test(file.type)) { toast('请选择图片文件', true); return; }
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var scale = Math.min(1, 480 / img.width);
            var cv = document.createElement('canvas');
            cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            u.photos = u.photos || [];
            u.photos.push({ date: DATA.dateStr(0), part: form.elements.part.value, src: cv.toDataURL('image/jpeg', 0.65) });
            save(); render(); toast('体态照片已保存');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        break;
      }
      case 'remind': {
        var type = el.getAttribute('data-type');
        u.reminders = u.reminders || {};
        u.reminders[type] = DATA.dateStr(0);
        save(); toast(type === 'waist' ? '已设置本周围度记录提醒' : '已设置本月拍照 / 体测提醒');
        break;
      }
      case 'like': {
        var post = state.posts.filter(function (p) { return p.id === id; })[0];
        if (!post) return;
        post.likes = post.likes || [];
        var i = post.likes.indexOf(u.id);
        if (i >= 0) post.likes.splice(i, 1); else post.likes.push(u.id);
        save(); render(); break;
      }
      case 'focus-comment': {
        var box = el.closest('article').querySelector('.comment-form input');
        if (box) box.focus();
        break;
      }
      case 'share': {
        var p2 = state.posts.filter(function (p) { return p.id === id; })[0];
        if (!p2) return;
        p2.shares = (p2.shares || 0) + 1; save(); render(); toast('已转发'); break;
      }
      case 'checkin': {
        var p3 = state.posts.filter(function (p) { return p.id === id; })[0];
        if (!p3 || p3.authorId === u.id) return;
        p3.checkins = p3.checkins || [];
        var today = DATA.dateStr(0);
        var dup = p3.checkins.some(function (c) { return c.userId === u.id && c.date === today; });
        if (dup) { toast('今天已经监督过啦', true); return; }
        p3.checkins.push({ userId: u.id, date: today });
        u.points = (u.points || 0) + 1;
        save(); render(); toast('监督打卡成功，积分 +1'); break;
      }
      case 'remind-author': {
        var p4 = state.posts.filter(function (p) { return p.id === id; })[0];
        if (!p4) return;
        p4.reminded = p4.reminded || [];
        p4.reminded.push({ by: u.id, date: DATA.dateStr(0) });
        save(); toast('已提醒发布者今日打卡'); break;
      }
      case 'go-cart': go('#/' + u.mode + '/me'); break;
      case 'add-cart': {
        var p5 = state.products.filter(function (p) { return p.id === id; })[0];
        if (!p5) return;
        var found = (u.cart || []).filter(function (c) { return c.productId === id; })[0];
        if (found) found.qty += 1; else (u.cart = u.cart || []).push({ productId: id, qty: 1 });
        save(); toast('已加入购物车：' + p5.name); break;
      }
      case 'cart-plus': case 'cart-minus': {
        var item = (u.cart || []).filter(function (c) { return c.productId === id; })[0];
        if (!item) return;
        item.qty += act === 'cart-plus' ? 1 : -1;
        if (item.qty <= 0) u.cart = u.cart.filter(function (c) { return c.productId !== id; });
        save(); render(); break;
      }
      case 'redeem': {
        var total = (u.cart || []).reduce(function (sum, it) {
          var p = state.products.filter(function (x) { return x.id === it.productId; })[0];
          return sum + (p ? p.points * it.qty : 0);
        }, 0);
        if (total <= 0) { toast('购物车为空', true); return; }
        if ((u.points || 0) < total) { toast('积分不足，还需 ' + (total - u.points) + ' 分', true); return; }
        if (!window.confirm('确认用 ' + total + ' 积分兑换购物车商品？')) return;
        u.orders = u.orders || [];
        u.orders.push({ date: DATA.dateStr(0), items: DATA.deepCopy(u.cart), points: total });
        u.points -= total; u.cart = [];
        save(); render(); toast('兑换成功，积分已扣减'); break;
      }
      case 'gen-plan': {
        u.plan = ENGINE.makePlan(u, state.products);
        u.plan.createdAt = DATA.dateStr(0);
        save(); render(); toast('方案已生成'); break;
      }
      case 'qa-chip': {
        var input = document.querySelector('[data-form="qa"] input');
        if (input) { input.value = el.getAttribute('data-q') || ''; input.focus(); }
        break;
      }
      case 'reset-demo':
        if (window.confirm('重置将清除全部本地演示数据，确认继续？')) {
          state = DATA.reset(); render(); toast('演示数据已重置');
        }
        break;
      case 'product-new': openModal(VIEWS.modals.productForm(null)); break;
      case 'product-edit': {
        var p6 = state.products.filter(function (p) { return p.id === id; })[0];
        if (p6) openModal(VIEWS.modals.productForm(p6));
        break;
      }
      case 'product-del': {
        var p7 = state.products.filter(function (p) { return p.id === id; })[0];
        if (!p7 || !window.confirm('确认删除产品「' + p7.name + '」？')) return;
        state.products = state.products.filter(function (p) { return p.id !== id; });
        save(); render(); toast('产品已删除'); break;
      }
      case 'user-detail': {
        var ud = DATA.getUser(id);
        if (ud) openModal(VIEWS.modals.userDetail(ud, state));
        break;
      }
      case 'user-plan': {
        var up = DATA.getUser(id);
        if (up) openModal(VIEWS.modals.userPlan(up, state));
        break;
      }
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'loginPhone') {
      var btn = document.getElementById('adminEntry');
      if (btn) btn.classList.toggle('hidden', e.target.value.trim() !== DATA.ADMIN_PHONE);
    }
  });

  function values(form) {
    var out = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name) return;
      if (el.type === 'checkbox') {
        if (el.checked) (out[el.name] = out[el.name] || []).push(el.value);
      } else out[el.name] = el.value;
    });
    return out;
  }
  function upsertRecord(u, data) {
    u.records = u.records || [];
    var found = u.records.filter(function (r) { return r.date === data.date; })[0];
    if (found) Object.keys(data).forEach(function (k) { found[k] = data[k]; });
    else u.records.unshift(data);
    u.records.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  function upsertDaily(u, data) {
    u.healthDaily = u.healthDaily || [];
    var found = u.healthDaily.filter(function (r) { return r.date === data.date; })[0];
    if (found) Object.keys(data).forEach(function (k) { found[k] = data[k]; }); else u.healthDaily.unshift(data);
    u.healthDaily.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }
  function upsertTest(u, data) {
    u.healthTests = u.healthTests || [];
    var found = u.healthTests.filter(function (r) { return r.date === data.date; })[0];
    if (found) Object.keys(data).forEach(function (k) { found[k] = data[k]; }); else u.healthTests.unshift(data);
    u.healthTests.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    var name = form.getAttribute('data-form');
    var v = values(form);
    var u = DATA.currentUser();

    if (name === 'login') {
      var phone = (v.phone || '').trim(), pwd = v.password || '';
      var found = state.users.filter(function (x) { return x.phone === phone; })[0];
      if (!found || found.password !== pwd) { toast('手机号或密码错误（演示密码 123456）', true); return; }
      pendingLogin = { userId: found.id, phone: phone };
      openModal(VIEWS.modals.userCode(phone)); return;
    }
    if (name === 'user-code') {
      if (!pendingLogin) { closeModal(); toast('验证已失效，请重新登录', true); return; }
      if ((v.code || '').trim() !== DATA.LOGIN_CODE) { toast('验证码错误', true); return; }
      var pendingUser = DATA.getUser(pendingLogin.userId);
      if (!pendingUser) { pendingLogin = null; closeModal(); toast('账号不存在，请重新登录', true); return; }
      pendingUser.mode = null;
      state.session = { type: 'user', userId: pendingUser.id };
      pendingLogin = null;
      save(); closeModal(); go('#/mode'); toast('登录成功，请选择模式'); return;
    }
    if (name === 'admin-code') {
      if ((v.code || '').trim() !== DATA.ADMIN_CODE) { toast('验证码错误', true); return; }
      state.session = { type: 'admin' };
      save(); closeModal(); go('#/admin/products'); toast('已进入管理员模式'); return;
    }
    var adminForms = ['product-search', 'user-search', 'cart-search', 'product-save'];
    if (!u && adminForms.indexOf(name) < 0) { toast('请先登录', true); return; }

    if (name === 'basic') {
      u.profile = u.profile || {};
      ['gender', 'age', 'height', 'targetWeight', 'targetBodyFat', 'goal', 'medical'].forEach(function (k) { if (v[k] != null) u.profile[k] = v[k]; });
      u.profile.weight = parseFloat(v.weight) || u.profile.weight;
      upsertRecord(u, { date: DATA.dateStr(0), weight: u.profile.weight });
      save(); render(); toast('基础档案已保存'); return;
    }
    if (name === 'record') {
      var group = form.getAttribute('data-group') || 'body';
      var payload = { date: v.date || DATA.dateStr(0) };
      var keys = {
        body: ['bodyFat', 'muscle', 'bmr', 'visceralFat', 'water', 'bone'],
        girth: ['waist', 'hip', 'chest', 'upperArm', 'thigh', 'whr'],
        recovery: ['restingHR', 'hrv', 'sleepHours', 'fatigue', 'trainingLoad', 'liftNote'],
        optional: ['bpSys', 'bpDia', 'glucose', 'spo2', 'vo2max', 'rr']
      }[group] || [];
      keys.forEach(function (k) { if (v[k] !== '' && v[k] != null) payload[k] = isNaN(Number(v[k])) ? v[k] : Number(v[k]); });
      if (group === 'girth' && payload.waist && payload.hip && !payload.whr) payload.whr = Math.round(payload.waist / payload.hip * 100) / 100;
      if (group === 'optional' && v.medical != null) u.profile.medical = v.medical;
      upsertRecord(u, payload); save(); render(); toast('记录已保存'); return;
    }
    if (name === 'health-profile') {
      u.profile = u.profile || {};
      ['gender', 'age', 'height', 'medical'].forEach(function (k) { if (v[k] != null) u.profile[k] = v[k]; });
      u.profile.weight = parseFloat(v.weight) || u.profile.weight;
      save(); render(); toast('基础信息已保存'); return;
    }
    if (name === 'health-daily') {
      var daily = { date: v.date || DATA.dateStr(0) };
      ['bpSys', 'bpDia', 'hr', 'glucose', 'sleepMinutes', 'wakeups'].forEach(function (k) {
        if (v[k] !== '') daily[k] = Number(v[k]) || 0;
      });
      upsertDaily(u, daily); save(); render(); toast('今日记录已保存'); return;
    }
    if (name === 'health-test') {
      var test = { date: v.date || DATA.dateStr(0) };
      ['balance', 'calf', 'cognition', 'breathHold', 'reach', 'sitToStand'].forEach(function (k) {
        if (v[k] !== '') test[k] = Number(v[k]) || 0;
      });
      upsertTest(u, test); save(); render(); toast('自测已保存，结论已更新'); return;
    }
    if (name === 'symptoms') {
      u.symptoms = v.symptom || [];
      u.meds = { onTime: v.onTime, missed: v.missed, adverse: v.adverse || '' };
      save(); render(); toast('症状与用药已保存'); return;
    }
    if (name === 'post') {
      var planText = v.plan || (u.plan ? u.plan.title + '：' + u.plan.train[0] : '暂未生成方案');
      state.posts.unshift({ id: DATA.uid('post'), authorId: u.id, title: v.title || '我的健康记录',
        content: v.content || '', plan: planText, createdAt: DATA.dateStr(0), likes: [], comments: [], shares: 0, checkins: [], reminded: [] });
      save(); render(); toast('方案已发布到广场'); return;
    }
    if (name === 'comment') {
      var post = state.posts.filter(function (p) { return p.id === form.getAttribute('data-id'); })[0];
      if (post && (v.text || '').trim()) {
        post.comments = post.comments || [];
        post.comments.push({ userId: u.id, text: v.text.trim(), date: DATA.dateStr(0) });
        save(); render(); toast('评论已发送');
      }
      return;
    }
    if (name === 'qa') {
      var q = (v.q || '').trim();
      if (!q) return;
      var answer = ENGINE.ask(q, u, state.products);
      u.qaLog = u.qaLog || [];
      u.qaLog.push({ q: q, a: answer, date: DATA.dateStr(0) });
      save(); render();
      var log = document.getElementById('qaLog');
      if (log) log.scrollTop = log.scrollHeight;
      return;
    }
    if (name === 'product-search') { filters.products = (v.q || '').trim(); render(); return; }
    if (name === 'user-search') { filters.users = (v.q || '').trim(); render(); return; }
    if (name === 'cart-search') { filters.carts = (v.q || '').trim(); render(); return; }
    if (name === 'product-save') {
      var nutrition = {};
      (v.nutritionText || '').split(/\n+/).forEach(function (line) {
        var idx = line.indexOf(':'); if (idx < 0) idx = line.indexOf('：');
        if (idx > 0) nutrition[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
      });
      function splitTags(t) { return (t || '').split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean); }
      var data = {
        name: (v.name || '').trim() || '未命名产品', category: (v.category || '').trim() || '其他',
        price: Number(v.price) || 0, points: Number(v.points) || 0, desc: v.desc || '',
        nutrition: nutrition, organic: splitTags(v.organicText), tags: splitTags(v.tagsText)
      };
      var pid = form.getAttribute('data-id');
      if (pid) {
        var target = state.products.filter(function (p) { return p.id === pid; })[0];
        if (target) Object.keys(data).forEach(function (k) { target[k] = data[k]; });
      } else {
        data.id = DATA.uid('p'); state.products.push(data);
      }
      save(); closeModal(); render(); toast('产品已保存'); return;
    }
  });

  window.addEventListener('hashchange', render);
  if (!location.hash) location.hash = '#/login';
  render();
})();

</script>
</body>
</html>
